<!-- Chatbot JustMixs -->
<div id="chatbot-container" class="chatbot-container">
  <button
    id="chatbot-toggle"
    class="chatbot-toggle"
    type="button"
    aria-label="Buka chatbot"
    aria-expanded="false"
    aria-controls="chatbot-window"
  >
    <span aria-hidden="true">💬</span>
  </button>

  <section
    id="chatbot-window"
    class="chatbot-window"
    aria-label="Chatbot JustMixs"
    hidden
  >
    <header class="chatbot-header">
      <div class="chatbot-title">
        <span class="chatbot-title-icon" aria-hidden="true">🍹</span>
        <div>
          <strong>Asisten JustMixs</strong>
          <span class="chatbot-status">Online</span>
        </div>
      </div>

      <button
        id="chatbot-close"
        class="chatbot-close"
        type="button"
        aria-label="Tutup chatbot"
      >
        ×
      </button>
    </header>

    <div
      id="chatbot-messages"
      class="chatbot-messages"
      aria-live="polite"
      aria-label="Percakapan chatbot"
    >
      <div class="message bot">
        Halo! Saya asisten virtual JustMixs. Tanyakan menu, harga, promo, alamat, gift, atau informasi buah. 😊
      </div>
    </div>

    <div class="chatbot-quick-questions" aria-label="Pertanyaan cepat">
      <button type="button" class="quick-question">
        Menu apa saja?
      </button>
      <button type="button" class="quick-question">
        Harga jus alpukat?
      </button>
      <button type="button" class="quick-question">
        Ada promo?
      </button>
      <button type="button" class="quick-question">
        Alamat outlet?
      </button>
    </div>

    <form id="chatbot-form" class="chatbot-form">
      <label class="sr-only" for="chatbot-input">
        Tulis pertanyaan untuk chatbot
      </label>

      <input
        id="chatbot-input"
        type="text"
        maxlength="400"
        placeholder="Contoh: Harga jus alpukat?"
        autocomplete="off"
        required
      />

      <button
        id="chatbot-send"
        class="chatbot-send"
        type="submit"
        aria-label="Kirim pertanyaan"
      >
        Kirim
      </button>
    </form>

    <p class="chatbot-note">
      Untuk pesanan cepat, hubungi WhatsApp toko.
    </p>
  </section>
</div>

<style>
  :root {
    --chat-primary: #7FD1B9;
    --chat-primary-dark: #54AA92;
    --chat-accent: #A8D8EA;
    --chat-warm: #FFE9A8;
    --chat-bg: #F9FBF9;
    --chat-text: #2D3E3A;
    --chat-border: #D9E7E1;
    --chat-white: #FFFFFF;
    --chat-shadow: 0 12px 30px rgba(31, 61, 52, 0.16);
  }

  .chatbot-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .chatbot-toggle {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--chat-primary);
    color: var(--chat-white);
    font-size: 1.55rem;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(47, 126, 104, 0.32);
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .chatbot-toggle:hover,
  .chatbot-toggle:focus-visible {
    background: var(--chat-primary-dark);
    transform: translateY(-3px);
    outline: none;
  }

  .chatbot-toggle:focus-visible,
  .chatbot-close:focus-visible,
  .chatbot-send:focus-visible,
  .quick-question:focus-visible {
    outline: 3px solid rgba(168, 216, 234, 0.95);
    outline-offset: 3px;
  }

  .chatbot-window {
    position: absolute;
    right: 0;
    bottom: 74px;
    width: min(360px, calc(100vw - 32px));
    overflow: hidden;
    border: 1px solid var(--chat-border);
    border-radius: 18px;
    background: var(--chat-white);
    box-shadow: var(--chat-shadow);
  }

  .chatbot-window[hidden] {
    display: none;
  }

  .chatbot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 15px;
    background: linear-gradient(135deg, var(--chat-primary), #9DDBC8);
    color: var(--chat-white);
  }

  .chatbot-title {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .chatbot-title-icon {
    width: 35px;
    height: 35px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    font-size: 1.1rem;
  }

  .chatbot-title strong {
    display: block;
    font-size: 0.98rem;
    line-height: 1.2;
  }

  .chatbot-status {
    display: block;
    margin-top: 2px;
    font-size: 0.76rem;
    opacity: 0.92;
  }

  .chatbot-close {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    color: var(--chat-white);
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .chatbot-close:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  .chatbot-messages {
    height: 285px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    background:
      radial-gradient(circle at top right, rgba(168, 216, 234, 0.2), transparent 42%),
      var(--chat-bg);
    scroll-behavior: smooth;
  }

  .message {
    width: fit-content;
    max-width: 86%;
    padding: 9px 11px;
    border-radius: 13px;
    font-size: 0.91rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .message.bot {
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    background: var(--chat-warm);
    color: var(--chat-text);
  }

  .message.user {
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    background: var(--chat-accent);
    color: var(--chat-text);
  }

  .message.typing {
    color: #5B716A;
    font-style: italic;
  }

  .chatbot-quick-questions {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 10px 12px;
    border-top: 1px solid #E8F0ED;
    background: var(--chat-white);
  }

  .quick-question {
    flex: 0 0 auto;
    border: 1px solid #CDE5DC;
    border-radius: 999px;
    background: #F1FAF6;
    color: #3C7868;
    padding: 6px 9px;
    font-size: 0.76rem;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .quick-question:hover {
    border-color: var(--chat-primary);
    background: #E3F6EF;
  }

  .chatbot-form {
    display: flex;
    gap: 8px;
    padding: 11px 12px;
    border-top: 1px solid #E8F0ED;
    background: var(--chat-white);
  }

  .chatbot-form input {
    min-width: 0;
    flex: 1;
    border: 1px solid #C8DDD5;
    border-radius: 10px;
    background: #FBFDFC;
    color: var(--chat-text);
    padding: 10px 11px;
    font: inherit;
    font-size: 0.9rem;
  }

  .chatbot-form input::placeholder {
    color: #8AA19A;
  }

  .chatbot-form input:focus {
    border-color: var(--chat-primary);
    outline: 3px solid rgba(127, 209, 185, 0.2);
  }

  .chatbot-send {
    border: 0;
    border-radius: 10px;
    background: var(--chat-primary);
    color: var(--chat-white);
    padding: 0 13px;
    font-weight: 700;
    font-size: 0.84rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .chatbot-send:hover:not(:disabled) {
    background: var(--chat-primary-dark);
    transform: translateY(-1px);
  }

  .chatbot-send:disabled,
  .chatbot-form input:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .chatbot-note {
    margin: 0;
    padding: 0 12px 12px;
    background: var(--chat-white);
    color: #6A8179;
    font-size: 0.72rem;
    text-align: center;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 480px) {
    .chatbot-container {
      right: 14px;
      bottom: 14px;
    }

    .chatbot-toggle {
      width: 54px;
      height: 54px;
    }

    .chatbot-window {
      right: -2px;
      bottom: 68px;
      width: min(360px, calc(100vw - 28px));
      border-radius: 16px;
    }

    .chatbot-messages {
      height: min(300px, 48vh);
    }

    .message {
      max-width: 90%;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Konfigurasi Endpoint Cloudflare Workers AI Anda
    const WORKER_URL = 'justmixs-ai-bot.justmix910.workers.dev';

    // 2. Selektor Elemen DOM
    const toggleBtn = document.getElementById('chatbot-toggle');
    const closeBtn = document.getElementById('chatbot-close');
    const chatWindow = document.getElementById('chatbot-window');
    const chatForm = document.getElementById('chatbot-form');
    const chatInput = document.getElementById('chatbot-input');
    const messagesContainer = document.getElementById('chatbot-messages');
    const sendBtn = document.getElementById('chatbot-send');
    const quickQuestions = document.querySelectorAll('.quick-question');

    let isTyping = false;

    // 3. Fungsi Buka & Tutup Jendela Chat
    function toggleChat(forceOpen) {
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : chatWindow.hasAttribute('hidden');
      
      if (shouldOpen) {
        chatWindow.removeAttribute('hidden');
        toggleBtn.setAttribute('aria-expanded', 'true');
        chatInput.focus();
        scrollToBottom();
      } else {
        chatWindow.setAttribute('hidden', '');
        toggleBtn.setAttribute('aria-expanded', 'false');
      }
    }

    toggleBtn.addEventListener('click', () => toggleChat());
    closeBtn.addEventListener('click', () => toggleChat(false));

    // 4. Fungsi Menambahkan Pesan ke Layar
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      
      // Jika AI sedang memikirkan jawaban, pasang kelas penanda khusus
      if (sender === 'typing') {
        msgDiv.id = 'chatbot-typing-indicator';
        msgDiv.classList.add('typing');
      }

      messagesContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('chatbot-typing-indicator');
      if (indicator) indicator.remove();
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 5. Fungsi Mengirim Pertanyaan ke Cloudflare AI Workers
    async function sendMessageToAI(text) {
      if (!text.trim() || isTyping) return;

      // Tampilkan pesan pengguna di layar
      addMessage(text, 'user');
      chatInput.value = '';
      
      // Kunci input & tombol kirim
      isTyping = true;
      chatInput.disabled = true;
      sendBtn.disabled = true;

      // Tampilkan status indikator mengetik
      addMessage('Sedang mengetik...', 'typing');

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        removeTypingIndicator();

        if (response.ok && data.reply) {
          addMessage(data.reply, 'bot');
        } else {
          addMessage(data.error || 'Maaf, terjadi gangguan koneksi ke server.', 'bot');
        }
      } catch (error) {
        removeTypingIndicator();
        addMessage('Gagal terhubung dengan asisten virtual. Periksa internet Anda.', 'bot');
        console.error('Error fetching chatbot:', error);
      } finally {
        // Buka kembali kunci input
        isTyping = false;
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    // 6. Handle Pengiriman via Form Submit
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessageToAI(chatInput.value);
    });

    // 7. Handle Tombol Pertanyaan Cepat (Quick Questions)
    quickQuestions.forEach(button => {
      button.addEventListener('click', () => {
        const questionText = button.textContent.trim();
        sendMessageToAI(questionText);
      });
    });
  });
</script>
